name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Release Build
        env:
          CHROME_EXTENSION_PRIVATE_KEY_B64: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY_B64 }}
        run: yarn release

      - name: Generate Release Metadata
        run: yarn release:metadata

      - name: Generate Release Notes (Conventional Commits)
        run: yarn release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: |
            comic-scroller-*.zip
            comic-scroller-*.crx
            latest-release.json

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comic-scroller
          path: |
            comic-scroller-*.zip
            comic-scroller-*.crx
            latest-release.json
